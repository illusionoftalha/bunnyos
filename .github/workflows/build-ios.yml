name: Build BunnyOS iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle & Sync iOS
        run: |
          npm run build
          npx cap add ios || true
          npx cap sync ios

      - name: Resolve Swift Packages
        run: |
          cd ios/App/CapApp-SPM
          swift package resolve

      - name: Compile iOS App & Package IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -target App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     -skipPackagePluginValidation \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     build

          mkdir -p ../../Payload
          find build -name "*.app" -exec cp -r {} ../../Payload/ \;
          cd ../..
          ls -la Payload/
          zip -r BunnyOS-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunnyOS-iOS-IPA
          path: BunnyOS-iOS.ipa
